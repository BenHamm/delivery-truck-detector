# Drop-in: persist systemd journal across reboots so previous-boot
# forensics (journalctl -b -1, --list-boots) actually work.
#
# Without this, journald uses /run/log/journal which clears on reboot,
# and we have to RTC-decode file-based /var/log/syslog to forensicate
# crashes. Added 2026-06-18 after a crash we couldn't root-cause due to
# missing previous-boot journal.
[Journal]
Storage=persistent
SystemMaxUse=500M
SystemMaxFileSize=50M
